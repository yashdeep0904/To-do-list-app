<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Isometric To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background floating 3D elements for aesthetics -->
    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2"></div>
    <div class="floating-shape shape-3"></div>

    <div class="scene">
        <main class="board">
            <header class="app-header">
                <h1 class="app-title">My Tasks</h1>
                <span class="badge">3D Mode</span>
            </header>

            <section class="task-input-section">
                <input type="text" id="taskInput" class="input-field" placeholder="What's next?">
                <button id="addTaskBtn" class="btn btn--primary">Add Task</button>
            </section>

            <section class="task-list-section">
                <ul id="taskList" class="task-list">
                    <!-- Tasks injected here -->
                </ul>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
